<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073b2b"><title>قُرّاء | إدارة الأدعية</title>
<style>
:root{--g:#073b2b;--g2:#0d513b;--gold:#d8b66a;--cream:#f8f4e9;--ink:#18372c;--red:#a63232}*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:var(--ink);font-family:Tahoma,Arial,sans-serif}.top{background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:22px max(18px,calc((100% - 1050px)/2));border-bottom:4px solid var(--gold)}h1{margin:0 0 6px;font-size:25px}.wrap{max-width:1050px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dce5dd;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px #1234}label{display:block;font-weight:bold;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd8ce;border-radius:9px;font:inherit;background:#fff}textarea{min-height:105px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:bold;cursor:pointer;background:var(--g);color:white;margin:5px 3px 0 0}.btn.alt{background:#e9efe9;color:var(--g)}.btn.red{background:var(--red)}.item{border:1px solid #dce5dd;border-radius:12px;padding:14px;margin-top:10px;background:#fcfdfb}.muted{color:#607367;font-size:13px}.status{padding:10px;border-radius:9px;background:#edf4ed;margin:10px 0;white-space:pre-wrap}.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{padding:20px}}
</style></head><body><header class="top"><h1>قُرّاء | إدارة الأدعية</h1><div>إضافة الأدعية وتعديلها وإخفاؤها دون إدخال JSON يدويًا.</div></header><main class="wrap"><section class="panel"><h2>الاتصال بلوحة الاختبار</h2><div class="grid"><div><label for="api">رابط API الاختبار</label><input id="api" value="https://quraa-api-staging.quraaweb.workers.dev" inputmode="url"></div><div><label for="token">رمز الإدارة (لا تشاركه مع أحد)</label><input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN"></div></div><button class="btn" id="connect">اتصال وتحميل الأدعية</button><button class="btn alt" id="forget">مسح الرمز المحفوظ من هذا الجهاز</button><div id="status" class="status" role="status">أدخل رمز الإدارة الخاص بنسخة الاختبار ثم اتصل.</div></section>
<section class="panel"><h2 id="formTitle">إضافة دعاء جديد</h2><form id="form"><input id="id" type="hidden"><label for="title">عنوان الدعاء</label><input id="title" required maxlength="180" placeholder="مثال: دعاء الاستفتاح"><label for="text">نص الدعاء</label><textarea id="text" required placeholder="اكتب نص الدعاء كاملًا"></textarea><div class="grid"><div><label for="source">المصدر / المرجع</label><input id="source" placeholder="السورة أو الحديث أو المرجع"></div><div><label for="category">التصنيف</label><input id="category" placeholder="أذكار الصباح، النوم، عام..."></div><div><label for="repetitions">عدد التكرارات</label><input id="repetitions" type="number" min="1" max="999" value="1"></div><div><label for="visible">الظهور للزوار</label><select id="visible"><option value="1">ظاهر</option><option value="0">مخفي</option></select></div></div><button class="btn" type="submit">حفظ الدعاء</button><button class="btn alt" type="button" id="reset">تفريغ النموذج</button></form></section>
<section class="panel"><h2>الأدعية المحفوظة</h2><div class="muted">يمكن تعديل الدعاء أو إخفاؤه عن الزوار أو حذفه نهائيًا.</div><div id="list"><p class="muted">اتصل بالخادم لعرض الأدعية.</p></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const KEY='quraa_admin_token';let duas=[];const api=()=> $('api').value.trim().replace(/\/+$/,'');const headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+$('token').value.trim()});function say(t,bad=false){$('status').textContent=t;$('status').style.background=bad?'#fbeaea':'#edf4ed';}
async function call(path,opts={}){const r=await fetch(api()+path,{...opts,headers:{...headers(),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok||d.ok===false)throw Error(d.error||('HTTP '+r.status));return d}
function reset(){ $('form').reset();$('id').value='';$('repetitions').value=1;$('visible').value='1';$('formTitle').textContent='إضافة دعاء جديد'}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const box=$('list');box.replaceChildren();if(!duas.length){box.innerHTML='<p class="muted">لا توجد أدعية بعد. أضف أول دعاء من النموذج أعلاه.</p>';return}for(const d of duas){const el=document.createElement('article');el.className='item';el.innerHTML=`<h3>${safe(d.title)}</h3><p>${safe(d.text).replace(/\n/g,'<br>')}</p><div class="muted">التصنيف: ${safe(d.category||'عام')} · التكرار: ${safe(d.repetitions||1)} · ${Number(d.is_visible)?'ظاهر للزوار':'مخفي'}</div>${d.source?`<p class="muted">المصدر: ${safe(d.source)}</p>`:''}<button class="btn" data-edit="${safe(d.id)}">تعديل</button><button class="btn alt" data-toggle="${safe(d.id)}">${Number(d.is_visible)?'إخفاء':'إظهار'}</button><button class="btn red" data-delete="${safe(d.id)}">حذف</button>`;box.append(el)} }
async function load(){const d=await call('/api/duas');duas=d.duas||[];render();say(`تم الاتصال بنجاح. عدد الأدعية: ${duas.length}.`)}
$('connect').onclick=async()=>{try{sessionStorage.setItem(KEY,$('token').value.trim());await call('/api/auth/check');await load()}catch(e){say('تعذر الاتصال: '+e.message,true)}};$('forget').onclick=()=>{sessionStorage.removeItem(KEY);$('token').value='';say('تم مسح الرمز المحفوظ من هذا الجهاز.')};$('token').value=sessionStorage.getItem(KEY)||'';
$('reset').onclick=reset;$('form').onsubmit=async e=>{e.preventDefault();const b={title:$('title').value.trim(),text:$('text').value.trim(),source:$('source').value.trim(),category:$('category').value.trim()||'عام',repetitions:Number($('repetitions').value)||1,is_visible:Number($('visible').value)};const id=$('id').value;try{await call('/api/duas'+(id?'/'+encodeURIComponent(id):''),{method:id?'PUT':'POST',body:JSON.stringify(b)});reset();await load();say('تم حفظ الدعاء بنجاح.')}catch(err){say('لم يتم الحفظ: '+err.message,true)}};
$('list').onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;const d=duas.find(x=>x.id===btn.dataset.edit||x.id===btn.dataset.toggle||x.id===btn.dataset.delete);if(!d)return;try{if(btn.dataset.edit){$('id').value=d.id;$('title').value=d.title;$('text').value=d.text;$('source').value=d.source||'';$('category').value=d.category||'';$('repetitions').value=d.repetitions||1;$('visible').value=String(Number(d.is_visible)?1:0);$('formTitle').textContent='تعديل الدعاء';window.scrollTo({top:0,behavior:'smooth'});return}if(btn.dataset.toggle){await call('/api/duas/'+encodeURIComponent(d.id),{method:'PATCH',body:JSON.stringify({is_visible:Number(d.is_visible)?0:1})});await load();return}if(btn.dataset.delete&&confirm('هل تريد حذف هذا الدعاء نهائيًا؟')){await call('/api/duas/'+encodeURIComponent(d.id),{method:'DELETE'});await load()}}catch(err){say('تعذر تنفيذ العملية: '+err.message,true)}};
})();
</script></body></html>
